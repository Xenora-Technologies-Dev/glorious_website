<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Static SEO defaults for non-JS crawlers and link previews; Seo.tsx removes these on mount. -->
    <title data-seo-default>Glorious Ascent | Connecting Global FMCG Markets</title>
    <meta data-seo-default name="description" content="Glorious Ascent General Trading L.L.C. is a Dubai-headquartered FMCG trading house for sourcing, private-label manufacturing, packaging and international distribution." />
    <link data-seo-default rel="canonical" href="https://gloriousascent.com/" />
    <meta data-seo-default property="og:site_name" content="Glorious Ascent" />
    <meta data-seo-default property="og:locale" content="en_US" />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:title" content="Glorious Ascent | Connecting Global FMCG Markets" />
    <meta data-seo-default property="og:description" content="Glorious Ascent General Trading L.L.C. is a Dubai-headquartered FMCG trading house for sourcing, private-label manufacturing, packaging and international distribution." />
    <meta data-seo-default property="og:url" content="https://gloriousascent.com/" />
    <meta data-seo-default property="og:image" content="https://gloriousascent.com/brand/logo-on-white.png" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:title" content="Glorious Ascent | Connecting Global FMCG Markets" />
    <meta data-seo-default name="twitter:description" content="Glorious Ascent General Trading L.L.C. is a Dubai-headquartered FMCG trading house for sourcing, private-label manufacturing, packaging and international distribution." />
    <meta data-seo-default name="twitter:image" content="https://gloriousascent.com/brand/logo-on-white.png" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <link rel="preload" as="image" href="/brand/hero-global-map.webp" type="image/webp" />
    <meta name="theme-color" content="#07111f" />
    <link rel="author" type="text/plain" href="/humans.txt" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Static copy of the enquiry form so Netlify Forms detects every field at deploy time. -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="website" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <select name="enquiryType"><option value="general">General</option></select>
      <input name="product" />
      <input name="brand" />
      <input name="packSize" />
      <input name="quantity" />
      <input name="deliveryDestination" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
