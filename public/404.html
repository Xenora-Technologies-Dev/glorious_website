<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07111f" />
    <title>Page not found | Glorious Ascent</title>
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <link rel="canonical" href="https://gloriousascent.com/" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
        background: #07111f;
        color: #f4efe4;
      }
      main { max-width: 36rem; }
      .eyebrow {
        margin: 0 0 1rem;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #c6a56a;
      }
      h1 {
        margin: 0;
        font-family: "DM Serif Display", "Times New Roman", serif;
        font-size: clamp(2.25rem, 7vw, 4rem);
        line-height: 1.05;
        font-weight: 400;
      }
      p {
        margin: 1.25rem 0 0;
        max-width: 28rem;
        line-height: 1.6;
        color: rgba(244, 239, 228, 0.72);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      a.gold { background: #c6a56a; color: #07111f; }
      a.outline { border: 1px solid rgba(244, 239, 228, 0.35); color: #f4efe4; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>This page is not on the map.</h1>
      <p>
        The page you requested is not on the Glorious Ascent website. Return home
        or start a commercial conversation.
      </p>
      <div class="actions">
        <a class="btn gold" href="/">Go Home</a>
        <a class="btn outline" href="/contact">Contact</a>
      </div>
    </main>
  </body>
</html>
